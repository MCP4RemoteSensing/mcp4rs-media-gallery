name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      hf_space_repo_id:
        description: Hugging Face Space repo ID
        required: true
        default: zlysunshine/mcp4rs-media-gallery

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ github.event.inputs.hf_space_repo_id || 'zlysunshine/mcp4rs-media-gallery' }}
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hugging Face CLI
        run: python -m pip install --upgrade huggingface_hub

      - name: Prepare Hugging Face Space files
        run: |
          mkdir -p hf_space

          cp .huggingface.yml hf_space/
          cp README.md hf_space/
          cp app.py hf_space/
          cp requirements.txt hf_space/
          cp source_queries.py hf_space/
          cp render_scene.py hf_space/
          cp render_desert.py hf_space/
          cp render_lake.py hf_space/

          mkdir -p hf_space/scripts hf_space/examples hf_space/docs hf_space/assets/preview

          cp scripts/export_media_sources.py hf_space/scripts/
          cp scripts/generate_media_gallery.py hf_space/scripts/
          cp scripts/check_logo.py hf_space/scripts/
          cp scripts/update_preview_assets.py hf_space/scripts/

          cp examples/*.py hf_space/examples/
          cp docs/*.md hf_space/docs/
          cp -r assets/preview/. hf_space/assets/preview/

          mkdir -p hf_space/media hf_space/figures hf_space/generated/provenance
          touch hf_space/media/.gitkeep
          touch hf_space/figures/.gitkeep
          touch hf_space/generated/provenance/.gitkeep

      - name: Validate selected Space files
        run: |
          test -f hf_space/README.md
          test -f hf_space/.huggingface.yml
          test -f hf_space/app.py
          test -f hf_space/requirements.txt

          python -m py_compile \
            hf_space/app.py \
            hf_space/source_queries.py \
            hf_space/render_scene.py \
            hf_space/render_desert.py \
            hf_space/render_lake.py \
            hf_space/scripts/export_media_sources.py \
            hf_space/scripts/generate_media_gallery.py

      - name: Upload selected files to Hugging Face
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret is missing. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          hf upload "$HF_SPACE" hf_space . \
            --repo-type space \
            --commit-message "Sync Space from GitHub ${GITHUB_SHA}" \
            --token "$HF_TOKEN"